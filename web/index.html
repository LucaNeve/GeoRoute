<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GeoRoute</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Globe Canvas Container -->
    <div id="canvas-container">
      <canvas id="globeCanvas"></canvas>
    </div>

    <!-- Top Left Status Header -->
    <div id="topLeft">
      <div id="currentBox" class="placeBox">Partenza</div>
      <div id="arrow">→</div>
      <div id="targetBox" class="placeBox">Obiettivo</div>
      <div id="timerDisplay" class="placeBox timer-box hidden">⏱ 01:00</div>
    </div>

    <!-- Top Right Actions & Settings Menu -->
    <div id="topRight">
      <div>
        <button id="menuButton" title="Menu">☰</button>
        <button id="newGameButton" title="Nuova partita">+</button>
        <button id="alignButton" title="Allinea equatore">⤒</button>
      </div>
      <div id="settingsMenu" class="hidden">
        <div id="menuControls">
          <div style="display:flex; flex-direction:column; gap:10px;">
            <label class="setting-row">
              <input type="checkbox" id="toggleSuggestions">
              <span>Suggerimenti nomi</span>
            </label>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08);">
            <div style="display:flex; gap:6px; align-items:center;">
              <input id="manualStart" placeholder="Nome Start" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff;">
              <button id="applyManualStart" title="Imposta partenza" class="icon-check">✓</button>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <input id="manualTarget" placeholder="Nome Target" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff;">
              <button id="applyManualTarget" title="Imposta obiettivo" class="icon-check">✓</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Input Controls -->
    <div id="bottomCenter">
      <div class="input-wrapper">
        <input id="countryInput" placeholder="Inserisci stato confinante..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <div id="suggestionsList" class="suggestions-dropdown hidden"></div>
      </div>
      <button id="submitButton" title="Invia stato (Enter)">➜</button>
    </div>

    <!-- Feedback & Sidebar -->
    <div id="statusLabel"></div>
    <div id="timelineSidebar" class="timeline-sidebar"></div>
    <div id="countryTooltip" class="tooltip hidden"></div>
  </div>

  <!-- Game Setup & Victory Overlay -->
  <div id="victoryOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
    <div class="overlay-card">
      <div id="victoryBadge" class="overlay-badge">🏆</div>
      <h1 id="victoryTitle">Hai vinto!</h1>
      <p id="victoryMessage">Hai completato la sfida con successo.</p>
      
      <div class="overlay-controls">
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="standard">
            <span class="mode-name">Classica</span>
          </button>
          <button class="mode-btn" data-mode="speedrun">
            <span class="mode-name">Sprint</span>
          </button>
          <button class="mode-btn" data-mode="hardcore">
            <span class="mode-name">Esperto</span>
          </button>
          <button class="mode-btn" data-mode="fog">
            <span class="mode-name">Inesplorata</span>
          </button>
        </div>

        <div class="overlay-section">
          <label>Difficoltà</label>
          <div class="choice-row" data-choice-group="difficulty">
            <button class="small" data-diff="easy" title="Facile">★</button>
            <button class="small" data-diff="medium" title="Medio">★★</button>
            <button class="small" data-diff="hard" title="Difficile">★★★</button>
          </div>
        </div>

        <div class="overlay-section">
          <label>Continente</label>
          <div class="choice-row" data-choice-group="continent">
            <button class="small" data-cont="all" title="Tutti">All</button>
            <button class="small" data-cont="Africa" title="Africa">AF</button>
            <button class="small" data-cont="Europe" title="Europa">EU</button>
            <button class="small" data-cont="Asia" title="Asia">AS</button>
            <button class="small" data-cont="Americas" title="Americhe">AM</button>
            <button class="small" data-cont="Oceania" title="Oceania">OC</button>
          </div>
        </div>
      </div>

      <div class="overlay-actions">
        <button id="playAgainButton" class="primary">Gioca ancora</button>
        <button id="closeVictoryButton" class="secondary">Chiudi</button>
      </div>
    </div>
  </div>

  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
