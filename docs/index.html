<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoRoute</title>
  <link rel="stylesheet" href="style.css" />
  <!-- TopoJSON library -->
  <script src="https://unpkg.com/topojson-client@3"></script>
</head>
<body>

  <!-- Canvas WebGL Globe -->
  <canvas id="globeCanvas"></canvas>

  <!-- Timer Speedrun -->
  <div id="timerDisplay" class="timer-badge hidden">⏱ 01:00</div>

  <!-- UI Interface Overlay -->
  <div class="ui-container">
    
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="route-display">
        <div id="currentBox" class="badge current-badge" title="Clicca per centrare la posizione attuale">-</div>
        <span class="route-arrow">➔</span>
        <div id="targetBox" class="badge target-badge" title="Clicca per centrare l'obiettivo">-</div>
      </div>
      
      <div class="header-actions">
        <button id="alignButton" class="icon-btn" title="Riallinea Polo Nord">🧭</button>
        <button id="menuButton" class="icon-btn" title="Impostazioni / Nuova Partita">⚙️</button>
      </div>
    </header>

    <!-- Timeline Sidebar (Cronologia percorsi) -->
    <aside id="timelineSidebar" class="timeline-sidebar"></aside>

    <!-- Bottom Controls Area -->
    <footer class="bottom-bar">
      <div id="statusLabel" class="status-label"></div>
      
      <div class="input-container">
        <div class="autocomplete-wrapper">
          <input 
            type="text" 
            id="countryInput" 
            placeholder="Scrivi il nome di uno stato..." 
            autocomplete="off" 
            disabled 
          />
          <div id="suggestionsList" class="suggestions-list hidden"></div>
        </div>
        <button id="submitButton" class="btn primary-btn" disabled>Invia</button>
      </div>
    </footer>

  </div>

  <!-- Country Tooltip on Hover -->
  <div id="countryTooltip" class="country-tooltip hidden"></div>

  <!-- Settings / Game Options Menu Modal -->
  <div id="settingsMenu" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title">Configura Partita</h2>
      <button id="closeSettingsButton" class="modal-close-btn" title="Chiudi">
        ✕
      </button>
      
      <!-- Modalità di Gioco -->
      <div class="setting-group">
        <label class="setting-label">Modalità</label>
        <div class="button-grid" data-choice-group="mode">
          <button class="choice-btn active" data-mode="standard">Standard</button>
          <button class="choice-btn" data-mode="speedrun">Speedrun</button>
          <button class="choice-btn" data-mode="hardcore">Hardcore</button>
          <button class="choice-btn" data-mode="fog">Nebbia</button>
          <button class="choice-btn" data-mode="custom">Personalizzata</button>
        </div>
      </div>

      <!-- Difficoltà (Segmented Control a Pillole) -->
      <div class="setting-group">
        <label class="setting-label">Difficoltà</label>
        <div class="segmented-control" data-choice-group="difficulty">
          <button class="segment-btn" data-diff="easy">
            <span class="diff-dot easy"></span> Facile
          </button>
          <button class="segment-btn active" data-diff="medium">
            <span class="diff-dot medium"></span> Medio
          </button>
          <button class="segment-btn" data-diff="hard">
            <span class="diff-dot hard"></span> Difficile
          </button>
        </div>
      </div>

      <!-- Continente -->
      <div class="setting-group">
        <label class="setting-label">Continente</label>
        <div class="button-grid" data-choice-group="continent">
          <button class="choice-btn active" data-cont="all">Tutti</button>
          <button class="choice-btn" data-cont="Europe">Europa</button>
          <button class="choice-btn" data-cont="Asia">Asia</button>
          <button class="choice-btn" data-cont="Africa">Africa</button>
          <button class="choice-btn" data-cont="Americas">Americhe</button>
        </div>
      </div>

      <!-- Opzioni Partita Personalizzata (Show/Hide dinamico) -->
      <div id="customGameOptions" class="custom-options hidden">
        <div class="input-group">
          <label for="customStartInput">Stato di Partenza</label>
          <input type="text" id="customStartInput" placeholder="Es. Italia" />
        </div>
        <div class="input-group">
          <label for="customTargetInput">Stato di Destinazione</label>
          <input type="text" id="customTargetInput" placeholder="Es. Giappone" />
        </div>
      </div>

      <!-- Suggerimenti Autocomplete Toggle -->
      <div class="setting-group checkbox-group">
        <label for="toggleSuggestions" class="setting-label">Mostra Suggerimenti</label>
        <input type="checkbox" id="toggleSuggestions" />
      </div>

      <div class="modal-actions">
        <button id="newGameButton" class="btn primary-btn full-width">Avvia Nuova Partita</button>
      </div>
    </div>
  </div>

  <!-- Victory / Defeat Overlay -->
  <div id="victoryOverlay" class="modal-overlay hidden">
    <div class="modal-card text-center">
      <div id="victoryBadge" class="modal-icon">🏆</div>
      <h2 id="victoryTitle" class="modal-title">Vittoria!</h2>
      <p id="victoryMessage" class="modal-message"></p>
      
      <div class="modal-actions">
        <button id="playAgainButton" class="btn primary-btn">Gioca ancora</button>
        <button id="closeVictoryButton" class="btn secondary-btn">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- App Script module -->
  <script type="module" src="app.js"></script>
</body>
</html>
